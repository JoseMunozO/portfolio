bio: "Allt började med Sune, min katt, och min flickvän, som började göra handgjorda ljus — tillsammans kom vi på namnet CandlePaw. Jag byggde en enkel webbsida för idén, och det var då jag upptäckte att jag gillade att programmera mer än att göra ljus. Sedan dess studerar jag Fullstackutveckling på Teknikhögskolan (Lund), och jag fortsätter bygga projekt — inklusive, så klart, CandlePaw självt, som jag nu bygger om ordentligt."
