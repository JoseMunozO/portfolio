backend:
  name: github
  repo: JoseMunozO/portfolio
  branch: main
  # Auth vía el OAuth provider de GitHub instalado en Netlify (Project
  # configuration > Security > OAuth). El backend "github" de Decap no
  # soporta auth_type: pkce (GitHub OAuth requiere intercambiar el code
  # por un token con client_secret, algo que solo puede hacerse server-side),
  # así que dejamos que Netlify haga de proxy — no hace falta app_id aquí.

# En local se puede editar sin login con:
#   npm run cms   (en una terminal)
#   npm run dev   (en otra terminal)
# y visitando http://localhost:5173/admin — Decap detecta localhost y usa
# el backend local automáticamente, sin necesitar login de GitHub.
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

i18n:
  structure: multiple_files
  locales: [es, en, sv]
  default_locale: es

collections:
  - name: "projects"
    label: "Proyectos"
    label_singular: "Proyecto"
    folder: "content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    summary: "{{title}} — {{status}}"
    i18n: true
    fields:
      - { label: "Título", name: "title", widget: "string", i18n: true }
      - label: "Estado"
        name: "status"
        widget: "select"
        default: "en-progreso"
        i18n: duplicate
        options:
          - { label: "Listo", value: "listo" }
          - { label: "En progreso", value: "en-progreso" }
          - { label: "Futuro", value: "futuro" }
      - label: "Descripción corta"
        name: "description"
        widget: "text"
        hint: "Se muestra en la tarjeta del proyecto"
        i18n: true
      - label: "Stack / tecnologías"
        name: "stack"
        widget: "list"
        default: []
        # i18n: duplicate no es válido para widgets "list" en esta versión
        # de Decap (falla la validación del schema) — el valor es el mismo
        # en los tres idiomas, solo que ahora se escribe una vez por locale.
        i18n: true
      - label: "Imagen de portada"
        name: "image"
        widget: "image"
        required: false
        i18n: duplicate
      - label: "Repositorio (GitHub)"
        name: "repoUrl"
        widget: "string"
        required: false
        i18n: duplicate
      - label: "Demo en vivo"
        name: "demoUrl"
        widget: "string"
        required: false
        i18n: duplicate
      - label: "Destacado"
        name: "featured"
        widget: "boolean"
        default: false
        i18n: duplicate
      # La fecha ya no se edita a mano: se calcula sola en build-time a partir
      # del último commit de git que tocó cada archivo (ver
      # scripts/generate-content-dates.mjs). Se actualiza automáticamente
      # cada vez que guardas un cambio desde este panel.
      - label: "Contenido extendido"
        name: "body"
        widget: "markdown"
        required: false
        i18n: true

  - name: "settings"
    label: "Configuración del sitio"
    files:
      - name: "general"
        label: "General"
        file: "content/settings/general.yml"
        i18n: true
        fields:
          - { label: "Nombre", name: "name", widget: "string", i18n: duplicate }
          - { label: "Foto de perfil", name: "photo", widget: "image", required: false, i18n: duplicate }
          - { label: "Rol / título", name: "role", widget: "string", i18n: true }
          - { label: "Frase de presentación", name: "tagline", widget: "string", i18n: true }
          - { label: "Biografía", name: "bio", widget: "text", i18n: true }
          - { label: "Skills", name: "skills", widget: "list", default: [], i18n: true }
          - label: "Enlaces de contacto"
            name: "contactLinks"
            widget: "list"
            i18n: true
            fields:
              - { label: "Etiqueta", name: "label", widget: "string", i18n: true }
              - { label: "URL", name: "url", widget: "string", i18n: duplicate }
